# Trading modes (section 3). Every value here is editable from the dashboard.
# Allocations are % of TRADING capital and must sum to <= 100.
selection_policy: FIXED          # FIXED | AUTO (meta agent recommends best enabled mode)

modes:
  INTRADAY:
    enabled: true
    allocation_pct: 50
    execution_policy: MANUAL_APPROVE      # AUTO | MANUAL_APPROVE | SIGNALS_ONLY
    approval_timeout_minutes: 3
    timeframes: ["5m", "15m", "1h"]
    primary_timeframe: "5m"
    entry_windows: [{start: "09:30", end: "14:45"}]
    max_trades_per_day: 3
    min_holding_days: 0
    max_holding_days: 0
    confidence_threshold: 70
    min_confluence: 60
    min_rr: 1.5
    min_grade: B
    universe: NIFTY50
    time_stop_minutes: 60                 # exit if not +0.5R within N minutes
    time_stop_min_r: 0.5
    trailing: ATR                         # ATR | EMA9_5M
    trail_atr_mult: 1.5
    partial_exit_at_r: 1.0
    partial_exit_pct: 50
    move_sl_to_breakeven_at_partial: true
    exit_before_events: false
    consecutive_loss_limit: 3
    consecutive_loss_pause_minutes: 60
    consecutive_loss_pause_days: 0
    max_symbols_per_cycle: 10
    agent_weights:
      fundamental: 0.5
      technical: 1.5
      price_action: 1.2
      volume_liquidity: 1.2
      market_context: 1.0
      news_sentiment: 0.6
      event_risk: 0.0
      entry_timing: 1.0
      stop_loss: 0.5
      exit_target: 0.5
    agents_enabled:
      event_risk: false

  BTST:
    enabled: false
    allocation_pct: 0
    execution_policy: MANUAL_APPROVE
    approval_timeout_minutes: 10
    timeframes: ["15m", "1h", "1d"]
    primary_timeframe: "1d"
    entry_windows: [{start: "14:45", end: "15:20"}]
    max_trades_per_day: 1
    min_holding_days: 1
    max_holding_days: 1
    confidence_threshold: 70
    min_confluence: 60
    min_rr: 2.0
    min_grade: B
    universe: NIFTY50
    trailing: NONE
    partial_exit_at_r: 1.0
    partial_exit_pct: 50
    exit_before_events: true
    consecutive_loss_limit: 3
    consecutive_loss_pause_minutes: 0
    consecutive_loss_pause_days: 1
    max_symbols_per_cycle: 15
    agent_weights:
      fundamental: 0.8
      technical: 1.2
      price_action: 1.2
      volume_liquidity: 1.3
      market_context: 1.2
      news_sentiment: 0.8
      event_risk: 1.2
      entry_timing: 0.8
      stop_loss: 0.5
      exit_target: 0.5

  SWING:
    enabled: true
    allocation_pct: 50
    execution_policy: MANUAL_APPROVE
    approval_until_next_session: "09:45"
    timeframes: ["1h", "1d"]
    primary_timeframe: "1d"
    entry_windows: [{start: "09:20", end: "10:30"}]
    max_trades_per_day: 2
    min_holding_days: 2
    max_holding_days: 10
    confidence_threshold: 70
    min_confluence: 60
    min_rr: 2.0
    min_grade: B
    universe: NIFTY100
    trailing: EMA20_DAILY                 # EMA20_DAILY | ATR_DAILY_CLOSE
    trail_atr_mult: 2.0
    partial_exit_at_r: 1.0
    partial_exit_pct: 50
    exit_before_events: true
    consecutive_loss_limit: 3
    consecutive_loss_pause_minutes: 0
    consecutive_loss_pause_days: 1
    max_symbols_per_cycle: 60
    agent_weights:
      fundamental: 1.2
      technical: 1.3
      price_action: 1.0
      volume_liquidity: 1.0
      market_context: 1.0
      news_sentiment: 0.8
      event_risk: 1.0
      entry_timing: 0.6
      stop_loss: 0.5
      exit_target: 0.5

  POSITIONAL:
    enabled: false
    allocation_pct: 0
    execution_policy: MANUAL_APPROVE
    approval_until_next_session: "09:45"
    timeframes: ["1d", "1wk"]
    primary_timeframe: "1d"
    entry_windows: [{start: "09:20", end: "10:30"}]
    max_trades_per_day: 1
    min_holding_days: 5
    max_holding_days: 63
    confidence_threshold: 70
    min_confluence: 60
    min_rr: 2.0
    min_grade: B
    universe: NIFTY200
    trailing: ATR_DAILY_CLOSE
    trail_atr_mult: 3.0
    partial_exit_at_r: 1.0
    partial_exit_pct: 50
    exit_before_events: true
    consecutive_loss_limit: 3
    consecutive_loss_pause_minutes: 0
    consecutive_loss_pause_days: 1
    max_symbols_per_cycle: 100
    agent_weights:
      fundamental: 1.6
      technical: 1.2
      price_action: 0.8
      volume_liquidity: 0.8
      market_context: 1.0
      news_sentiment: 0.6
      event_risk: 1.0
      entry_timing: 0.4
      stop_loss: 0.5
      exit_target: 0.5
