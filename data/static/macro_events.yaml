#
# VERIFY: best-effort dates. RBI publishes the MPC schedule for each financial year in advance,
# the US Fed publishes FOMC dates a year ahead, the Union Budget is normally presented on 1 Feb.
# Dates marked verified: false are estimates - check rbi.org.in / federalreserve.gov and edit.
#
# event_date = the IST calendar date on which Indian markets first trade the outcome:
#   * RBI MPC  : decision announced ~10:00 IST on the last day of the meeting -> that day.
#   * Budget   : presented ~11:00 IST -> that day.
#   * US FOMC  : statement 14:00 US Eastern on the 2nd meeting day = ~00:30 IST the NEXT day,
#                so event_date is the day after the US decision date (us_date kept in details).
